<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>WhatsApp Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="tabbar">
    <div id="tabs"></div>
    <button id="settings" class="iconbtn" title="Settings (Ctrl+,)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.33-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.74 8.87a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.3.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.23.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
    </button>
    <button id="add" title="Add account (Ctrl+T)">＋</button>
  </header>
  <main id="content">
    <div id="empty" class="hidden">
      <div class="empty-logo">
        <svg width="96" height="96" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#25D366"/>
              <stop offset="100%" stop-color="#0E9F6E"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#g)"/>
          <g fill="#ffffff">
            <path d="M 150 386 L 150 344 C 118 322 98 290 98 252 C 98 192 146 146 206 146 C 266 146 314 192 314 252 C 314 312 266 358 206 358 C 187 358 170 353 155 344 Z"/>
            <circle cx="168" cy="252" r="14"/>
            <circle cx="206" cy="252" r="14"/>
            <circle cx="244" cy="252" r="14"/>
          </g>
        </svg>
      </div>
      <h1>WhatsApp Web</h1>
      <p>Run multiple WhatsApp Web accounts side by side. Each account keeps its own isolated session.</p>
      <button id="empty-add">Add account</button>
      <div class="hint">
        Ctrl+T add &middot; Ctrl+W close &middot; Ctrl+Shift+K switcher &middot; Ctrl+Tab switch &middot; Ctrl+1&ndash;9 select &middot; Ctrl+Shift+M mute &middot; Alt+1&ndash;9 global switch
      </div>
    </div>
  </main>
  <div id="quickSwitcher" class="overlay hidden">
    <div class="palette">
      <input id="quickFilter" type="text" placeholder="Switch to account…" autofocus>
      <div id="quickList"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="tabs.js"></script>
</body>
</html>
